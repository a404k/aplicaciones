<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Aura Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #030305;
        --surface: rgba(20, 20, 25, 0.4);
        --surface-hover: rgba(30, 30, 40, 0.6);
        --accent: #00f2ff;
        --accent-glow: rgba(0, 242, 255, 0.4);
        --premium: #facc15;
        --beta: #a855f7;
        --text: #ffffff;
        --sub: #94a3b8;
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.2);
        --radius-lg: 28px;
        --radius-md: 20px;
        --radius-sm: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    
    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        overflow-x: hidden;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        position: relative;
    }

    /* Fondo dinámico animado */
    .ambient-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        background: radial-gradient(circle at 15% 50%, rgba(168, 85, 247, 0.08), transparent 50%),
                    radial-gradient(circle at 85% 30%, rgba(0, 242, 255, 0.08), transparent 50%);
    }
    .ambient-bg::before, .ambient-bg::after {
        content: '';
        position: absolute;
        width: 60vmax;
        height: 60vmax;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
        animation: float 20s infinite alternate ease-in-out;
    }
    .ambient-bg::before {
        top: -20%; left: -10%;
        background: radial-gradient(circle, rgba(0, 242, 255, 0.1) 0%, transparent 70%);
    }
    .ambient-bg::after {
        bottom: -20%; right: -10%;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, transparent 70%);
        animation-delay: -10s;
    }

    @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(10%, 15%) scale(1.2); }
    }

    /* Navegación Glassmorfismo */
    nav {
        position: sticky;
        top: 0;
        background: rgba(3, 3, 5, 0.6);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        z-index: 100;
        padding: 16px clamp(20px, 5vw, 40px);
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.3s ease;
    }

    .brand {
        font-weight: 800;
        font-size: clamp(22px, 3vw, 28px);
        letter-spacing: -1px;
        background: linear-gradient(to right, #fff, var(--accent), #fff);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 4s linear infinite;
    }

    @keyframes shine { to { background-position: 200% center; } }

    /* Buscador interactivo */
    .search-container {
        display: flex;
        align-items: center;
        position: relative;
    }

    .search-bar {
        width: 0;
        opacity: 0;
        padding: 0;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid transparent;
        border-radius: 100px;
        color: var(--text);
        font-family: inherit;
        font-size: 15px;
        outline: none;
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        position: absolute;
        right: 50px;
        backdrop-filter: blur(10px);
    }

    .search-bar.show {
        width: clamp(200px, 40vw, 400px);
        opacity: 1;
        padding: 10px 20px;
        border-color: var(--accent-glow);
        box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
    }
    
    .search-bar::placeholder { color: var(--sub); }
    .search-bar:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.05); }

    .search-btn {
        width: 44px;
        height: 44px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        color: white;
        z-index: 2;
    }

    .search-btn:hover {
        background: var(--text);
        color: var(--bg);
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    /* Cabecera */
    header {
        padding: clamp(40px, 6vw, 80px) clamp(20px, 5vw, 40px) clamp(20px, 4vw, 40px);
        max-width: 1400px;
        margin: 0 auto;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .badge {
        background: rgba(0, 242, 255, 0.1);
        border: 1px solid var(--accent-glow);
        color: var(--accent);
        padding: 6px 16px;
        border-radius: 100px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 20px;
        display: inline-block;
        animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.4); }
        100% { box-shadow: 0 0 15px 0 rgba(0, 242, 255, 0.1); }
    }

    header h1 {
        font-size: clamp(36px, 6vw, 72px);
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1.1;
        margin-bottom: 12px;
    }

    header p {
        color: var(--sub);
        font-size: clamp(16px, 1.5vw, 20px);
        font-weight: 400;
        max-width: 500px;
        line-height: 1.5;
    }

    /* Grid de Apps */
    main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 clamp(20px, 5vw, 40px) 60px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: clamp(16px, 2vw, 24px);
    }

    /* Efecto Hover Inteligente (Spotlight) */
    #app-grid:hover > .app-card::after {
        opacity: 1;
    }

    .app-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        text-decoration: none;
        color: inherit;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease;
        
        /* Variables para el spotlight */
        --mouse-x: 50%;
        --mouse-y: 50%;
        
        opacity: 0;
        transform: translateY(20px);
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUp {
        to { opacity: 1; transform: translateY(0); }
    }

    /* Borde luminoso interactivo (Spotlight) */
    .app-card::before, .app-card::after {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: inherit;
        transition: opacity 0.4s ease;
        pointer-events: none;
    }

    .app-card::before {
        background: radial-gradient(800px circle at var(--mouse-x) var(--mouse-y), rgba(255, 255, 255, 0.06), transparent 40%);
        z-index: 1;
        opacity: 0;
    }
    
    .app-card:hover::before { opacity: 1; }
    .app-card:hover { 
        transform: translateY(-4px); 
        border-color: var(--border-hover);
        background: var(--surface-hover);
    }

    .app-icon {
        width: 72px;
        height: 72px;
        border-radius: var(--radius-md);
        object-fit: cover;
        background: #1c1c21;
        padding: 2px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.1);
        z-index: 2;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app-card:hover .app-icon { transform: scale(1.05) rotate(-3deg); }

    .app-info {
        flex: 1;
        min-width: 0;
        z-index: 2;
    }

    .app-info h2 {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 4px;
        letter-spacing: -0.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .cat {
        font-size: 12px;
        color: var(--sub);
        margin-bottom: 12px;
        font-weight: 500;
        display: block;
    }

    .btn-dl {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        padding: 8px 20px;
        border-radius: 100px;
        font-size: 12px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        border: 1px solid var(--border);
    }

    .app-card:hover .btn-dl {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
    }

    .tag {
        position: absolute;
        top: 0;
        right: 0;
        font-size: 10px;
        font-weight: 800;
        padding: 6px 16px;
        border-bottom-left-radius: var(--radius-sm);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        z-index: 3;
        backdrop-filter: blur(8px);
    }

    .tag.premium { background: rgba(250, 204, 21, 0.15); color: var(--premium); border-left: 1px solid rgba(250, 204, 21, 0.3); border-bottom: 1px solid rgba(250, 204, 21, 0.3); }
    .tag.beta { background: rgba(168, 85, 247, 0.15); color: var(--beta); border-left: 1px solid rgba(168, 85, 247, 0.3); border-bottom: 1px solid rgba(168, 85, 247, 0.3); }
    .tag.nuevo { background: rgba(0, 242, 255, 0.15); color: var(--accent); border-left: 1px solid rgba(0, 242, 255, 0.3); border-bottom: 1px solid rgba(0, 242, 255, 0.3); }

    .app-card.hidden { display: none; }
    
    #no-results {
        grid-column: 1 / -1;
        text-align: center;
        color: var(--sub);
        font-size: 16px;
        padding: 60px 0;
        animation: slideUp 0.4s ease;
    }

    /* Optimizaciones Mobile */
    @media (max-width: 768px) {
        main {
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            padding: 0 16px 40px;
        }
        
        .app-card {
            flex-direction: column;
            text-align: center;
            padding: 24px 16px 16px;
            border-radius: var(--radius-md);
        }

        .tag {
            border-bottom-left-radius: 0;
            width: 100%;
            text-align: center;
            padding: 4px;
            font-size: 9px;
        }

        .app-icon { width: 64px; height: 64px; margin-top: 8px; }
        .app-info h2 { font-size: 16px; }
        .btn-dl { width: 100%; padding: 10px 0; }
        
        .search-bar.show {
            width: calc(100vw - 110px);
        }
    }

    @media (hover: none) {
        .app-card::before { display: none; }
        .app-card:active { transform: scale(0.96); background: var(--surface-hover); }
    }
</style>
</head>
<body>

<div class="ambient-bg"></div>

<nav>
    <div class="brand">Aura Store</div>
    <div class="search-container">
        <input id="searchInput" class="search-bar" type="text" placeholder="Buscar aplicaciones..." autocomplete="off">
        <button id="searchBtn" class="search-btn" aria-label="Buscar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </button>
    </div>
</nav>

<header>
    <div class="badge">Aura Premium</div>
    <h1>Descubre el <br>Siguiente Nivel</h1>
    <p>Explora un ecosistema seleccionado de herramientas exclusivas y aplicaciones diseñadas para potenciar tu día a día.</p>
</header>

<main id="app-grid"></main>

<script>
    const apps = [
        {n:'KoKo', c:'Extra • v1.7.117', i:'logos/koko.png', f:'KoKo.apk', t:'premium'},
        {n:'Camara', c:'Extra • v19.0.1', i:'logos/Camara.png', f:'Camara.apk', t:'nuevo'},
        {n:'Cleaner', c:'Utilidad • v2.0.5', i:'logos/Cleaner.webp', f:'Cleaner.apk', t:'premium'},
        {n:'WhaTup', c:'Social • v1.8.0', i:'logos/Whatup.webp', f:'WhaTup.apk', t:'beta'},
        {n:'Wallpapers', c:'Diseño • v11.18', i:'logos/Wallpaper.webp', f:'Wallpaper.apk', t:'premium'},
        {n:'TubePlus', c:'Media • v1.30.0', i:'logos/TubePlus.webp', f:'TubePlus.apk', t:'nuevo'},
        {n:'Diana', c:'Inteligencia Artificial • v1.0.0', i:'logos/Diana.webp', f:'Diana.apk', t:'nuevo'},
        {n:'LocalKey', c:'Seguridad • v1.0.0', i:'logos/LocalKey.webp', f:'LocalKey.apk', t:'nuevo'}
    ];

    const grid = document.getElementById('app-grid');

    function renderCards(list) {
        grid.innerHTML = '';
        list.forEach((app, i) => {
            const card = document.createElement('a');
            card.href = app.f;
            card.className = 'app-card';
            // Retraso escalonado para la animación de entrada
            card.style.animationDelay = `${i * 0.08}s`;
            card.setAttribute('download', '');
            card.dataset.name = app.n.toLowerCase();
            card.innerHTML = `
                <span class="tag ${app.t}">${app.t}</span>
                <img class="app-icon" src="${app.i}" alt="${app.n}" onerror="this.src='https://ui-avatars.com/api/?name=${app.n}&background=1c1c21&color=ffffff&bold=true'">
                <div class="app-info">
                    <h2>${app.n}</h2>
                    <span class="cat">${app.c}</span>
                    <div class="btn-dl">Obtener</div>
                </div>`;
            grid.appendChild(card);
        });
    }

    renderCards(apps);

    // Lógica del buscador interactivo
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');

    searchBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        searchInput.classList.toggle('show');
        if (searchInput.classList.contains('show')) {
            searchInput.focus();
        } else {
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
        }
    });

    // Cerrar buscador al hacer click fuera
    document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && e.target !== searchBtn && !searchBtn.contains(e.target)) {
            searchInput.classList.remove('show');
        }
    });

    // Filtrado de aplicaciones
    searchInput.addEventListener('input', () => {
        const q = searchInput.value.toLowerCase().trim();
        document.querySelectorAll('.app-card').forEach(c => {
            const match = c.dataset.name.includes(q) || c.querySelector('.cat').textContent.toLowerCase().includes(q);
            c.classList.toggle('hidden', !match);
        });

        const visible = document.querySelectorAll('.app-card:not(.hidden)').length;
        if (!visible && q) {
            let msg = document.getElementById('no-results');
            if (!msg) {
                msg = document.createElement('div');
                msg.id = 'no-results';
                grid.appendChild(msg);
            }
            msg.innerHTML = `
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px;">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <p>No encontramos nada para "<b>${searchInput.value}</b>"</p>
            `;
        } else {
            const msg = document.getElementById('no-results');
            if (msg) msg.remove();
        }
    });

    // Efecto Spotlight (Seguimiento del ratón) para tarjetas
    grid.onmousemove = e => {
        for(const card of document.getElementsByClassName("app-card")) {
            const rect = card.getBoundingClientRect(),
                  x = e.clientX - rect.left,
                  y = e.clientY - rect.top;

            card.style.setProperty("--mouse-x", `${x}px`);
            card.style.setProperty("--mouse-y", `${y}px`);
        };
    }

    // Prevenir menú contextual para dar sensación de app nativa
    document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
